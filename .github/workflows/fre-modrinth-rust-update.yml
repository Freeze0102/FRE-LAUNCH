name: FRE LAUNCH Vue Rust Windows Update

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish approved signed v0.5.13 to in-launcher updates (requires FRE_LAUNCH_SECURITY_APPROVED=true)'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: frelaunch-vue-rust-release
  cancel-in-progress: false

jobs:
  windows-vue-rust:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.FRE_TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.FRE_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the real Vue/Tauri FRE LAUNCH fork
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Verify version, source and signing key before spending build minutes
        shell: pwsh
        env:
          WILL_PUBLISH: ${{ inputs.publish }}
          SECURITY_APPROVED: ${{ vars.FRE_LAUNCH_SECURITY_APPROVED }}
        run: |
          $ErrorActionPreference = 'Stop'
          $channel = Get-Content 'update-channel.json' -Raw | ConvertFrom-Json
          if ($channel.version -ne '0.5.13') { throw 'Review the versioned workflow before running it for any other release' }
          if (!$env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'Missing FRE_TAURI_SIGNING_PRIVATE_KEY secret. Use the EXISTING 0.5.9 Tauri updater key, not a newly generated key.'
          }
          if ($env:WILL_PUBLISH -eq 'true' -and $env:SECURITY_APPROVED -ne 'true') {
            throw 'Publishing requires explicit FRE_LAUNCH_SECURITY_APPROVED=true after independent review'
          }
          gh release view "v$($channel.version)" --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0 -and $env:WILL_PUBLISH -eq 'true') { throw 'Release tag already exists; existing signed releases are immutable' }
          if (!(Test-Path 'scripts/modrinth-fork/feature_fre_rust.py')) {
            throw 'This is not the new Vue/Rust source checkout.'
          }

      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            vendor/fre-rust-source -> target
            FRE-Modrinth-Source -> target

      - name: Install pinned frontend/build tools
        shell: pwsh
        run: |
          npm.cmd install -g pnpm@12.11.2
          if ($LASTEXITCODE -ne 0) { throw 'Could not install required pnpm' }
          python -m pip install 'Pillow>=11,<13'
          if ($LASTEXITCODE -ne 0) { throw 'Could not install Python image dependency' }

      - name: Restore verified native Rust game binaries from shared main-branch cache
        id: rust-engine-cache
        uses: actions/cache/restore@v4
        with:
          path: scripts/modrinth-fork/fre-rust-runtime
          key: frelaunch-windows-x64-rust-975c07d9151847e6af13afc4b5ab37b6bbe78ef5-v2

      - name: Compile MIT native Rust game only on cache miss
        if: steps.rust-engine-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          ./scripts/modrinth-fork/ci-build-native-engine.ps1
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Native Rust client build failed' }
          if (Test-Path 'scripts/modrinth-fork/fre-rust-runtime/resources') {
            throw 'Proprietary Minecraft resources must never enter public GitHub update packages'
          }

      - name: Cache native engine for later previews and signed builds
        if: steps.rust-engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: scripts/modrinth-fork/fre-rust-runtime
          key: frelaunch-windows-x64-rust-975c07d9151847e6af13afc4b5ab37b6bbe78ef5-v2

      - name: Verify cached or newly compiled Rust game and preparer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'scripts/modrinth-fork/fre-rust-runtime'
          $info = Get-Content -LiteralPath "$root/BUILD-INFO.json" -Raw | ConvertFrom-Json
          if ($info.source_commit -ne '975c07d9151847e6af13afc4b5ab37b6bbe78ef5' -or $info.engine_license -ne 'MIT') {
            throw 'Unapproved Rust engine source revision or license'
          }
          foreach ($item in @(
            @{name='fre-rust-client.exe'; field='game_exe_sha256'},
            @{name='fre-rust-prepare.exe'; field='prepare_exe_sha256'}
          )) {
            $file = Join-Path $root $item.name
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing native game component: $($item.name)" }
            $expected = [string]$info.($item.field)
            if ($expected -notmatch '^[0-9a-fA-F]{64}$' -or (Get-FileHash $file -Algorithm SHA256).Hash -ine $expected) {
              throw "Native game component checksum mismatch: $($item.name)"
            }
          }
          foreach ($source in @(
            'research-lock.json', 'LICENSE.txt', 'crates/fre-prepare/Cargo.toml',
            'crates/fre-prepare/build.rs', 'crates/fre-prepare/src/lib.rs',
            'mods/fre/src/test/java/dev/frelaunch/parity/VanillaHeightmapOracle.java'
          )) {
            if (!(Test-Path -LiteralPath (Join-Path $root $source) -PathType Leaf)) {
              throw "Native resource preparer source snapshot incomplete: $source"
            }
          }
          if (Test-Path "$root/resources") { throw 'Public packages cannot contain proprietary Minecraft assets' }

      - name: Compile full Vue/Tauri launcher with strict checks and existing update signature
        shell: pwsh
        run: |
          ./FRE-MODRINTH-LOCAL.ps1 -BuildWindows
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Vue/Tauri FRE LAUNCH build failed' }

      - name: Run Vue in-app content and Rust profile regression tests
        shell: pwsh
        run: |
          node scripts/modrinth-fork/test_frontend.cjs FRE-Modrinth-Source
          if ($LASTEXITCODE -ne 0) { throw 'In-app content or Rust profile regression tests failed' }

      - name: Verify compiled Windows installers and Defender status
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'FRE-Modrinth-Source/target/release/bundle/nsis'
          $installer = Get-ChildItem $dir -File -Filter '*.exe' | Select-Object -First 1
          if (!$installer) { throw 'No real Vue/Tauri installer was produced' }
          if (!(Test-Path "$($installer.FullName).sig")) { throw 'Signed updater artifact missing' }
          if (!(Get-Command Get-MpComputerStatus -ErrorAction SilentlyContinue)) {
            throw 'Microsoft Defender unavailable; fail closed'
          }
          $defender = Get-MpComputerStatus
          if (!$defender.AMServiceEnabled -or !$defender.AntivirusEnabled) { throw 'Microsoft Defender is not active' }
          Update-MpSignature -ErrorAction Stop
          Start-MpScan -ScanType CustomScan -ScanPath $installer.FullName -ErrorAction Stop
          if (!(Test-Path $installer.FullName)) { throw 'Installer quarantined' }
          $exe = Get-ChildItem 'FRE-Modrinth-Source/target/release' -File -Filter '*.exe' | Select-Object -First 1
          if (!$exe) { throw 'Vue/Tauri desktop executable missing' }
          Start-MpScan -ScanType CustomScan -ScanPath $exe.FullName -ErrorAction Stop
          $rustExe = (Resolve-Path 'scripts/modrinth-fork/fre-rust-runtime/fre-rust-client.exe').Path
          $prepareExe = (Resolve-Path 'scripts/modrinth-fork/fre-rust-runtime/fre-rust-prepare.exe').Path
          Start-MpScan -ScanType CustomScan -ScanPath $rustExe -ErrorAction Stop
          Start-MpScan -ScanType CustomScan -ScanPath $prepareExe -ErrorAction Stop
          if (!(Test-Path -LiteralPath $rustExe)) { throw 'Rust game executable was quarantined' }
          if (!(Test-Path -LiteralPath $prepareExe)) { throw 'Native Rust resource preparer was quarantined' }
          if (@(Get-MpThreatDetection).Count) { throw 'Defender reported a malware detection: release blocked' }
          Write-Host "Scanned executable: $($exe.Name)"
          Write-Host "Scanned installer: $($installer.Name)"
          "FRE_REVIEW_INSTALLER=$($installer.FullName)" >> $env:GITHUB_ENV

      - name: Install into a fresh directory and smoke-test launch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:RUNNER_TEMP 'FRELaunchVueRustSmoke'
          $process = Start-Process -FilePath $env:FRE_REVIEW_INSTALLER -ArgumentList @('/S',"/D=$folder") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS installation failed: $($process.ExitCode)" }
          # Installer also carries Rust game and preparer; never launch
          # whichever bundled EXE happens to have the largest file size.
          $executables = @(Get-ChildItem -LiteralPath $folder -Recurse -File -Filter 'FRE LAUNCH.exe')
          if ($executables.Count -ne 1) { throw "Expected exactly one installed FRE LAUNCH.exe, found $($executables.Count)" }
          $app = Start-Process -FilePath $executables[0].FullName -PassThru
          Start-Sleep -Seconds 12
          $app.Refresh()
          if ($app.HasExited) { throw "New Vue/Tauri launcher exited during startup: $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
          Write-Host 'Installed Vue/Tauri launcher survived 12-second Windows startup smoke'

      - name: Package signed update and create reproducible provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content 'update-channel.json' -Raw | ConvertFrom-Json).version
          $notes = "FRE LAUNCH $version — independent Minecraft 26.3 on Rust inside FRE LAUNCH, with its own instances, bundled MIT-native game and resource preparer, verified Mojang downloads and privately managed Java 25. Uses FRE LAUNCH directly with no second launcher or account. Local .hmod content mods and Java instance features are retained. Automatic .hnmod native-code builds remain unsupported. Source: $env:GITHUB_SHA. Proprietary Minecraft assets are never included; this requires separate signed release approval."
          Set-Content -LiteralPath 'release-notes-ci.md' -Value $notes -Encoding UTF8
          node scripts/modrinth-fork/package-update.mjs $env:FRE_REVIEW_INSTALLER release-notes-ci.md
          if ($LASTEXITCODE -ne 0) { throw 'Minisign updater verification failed: do not publish' }
          $stage = Join-Path 'release-staging' "v$version"
          $hash = (Get-FileHash -LiteralPath (Join-Path $stage 'FRE-LAUNCH-Windows-x64-Setup.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          $provenance = [ordered]@{
            sourceCommit = "$env:GITHUB_SHA"
            engineSourceRevision = '975c07d9151847e6af13afc4b5ab37b6bbe78ef5'
            proprietaryMinecraftAssetsIncluded = $false
            installer = @{ sha256 = $hash; signatureVerified = $true }
            defender = @{ active = $true; threatsFound = 0; launcherExitCode = 0; installerExitCode = 0 }
          }
          $provenance | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $stage 'PROVENANCE.json') -Encoding utf8
          "FRE_REVIEW_STAGE=$stage" >> $env:GITHUB_ENV
          Write-Host "Signed Vue/Rust updater verified: SHA-256 $hash"

      - name: Upload reviewable EXE, signature and update manifest
        uses: actions/upload-artifact@v4
        with:
          name: FRE-LAUNCH-v0.5.13-Vue-Rust-Windows-REVIEW
          path: |
            release-staging/v0.5.13/FRE-LAUNCH-Windows-x64-Setup.exe
            release-staging/v0.5.13/FRE-LAUNCH-Windows-x64-Setup.exe.sig
            release-staging/v0.5.13/latest.json
            release-staging/v0.5.13/SHA256SUMS.txt
            release-staging/v0.5.13/PROVENANCE.json
            release-staging/v0.5.13/NOTES.md
          if-no-files-found: error
          retention-days: 7

      - name: Publish signed v0.5.13 to the installed launcher
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true && vars.FRE_LAUNCH_SECURITY_APPROVED == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '0.5.13'
          $stage = $env:FRE_REVIEW_STAGE
          $tag = "v$version"
          $files = @('FRE-LAUNCH-Windows-x64-Setup.exe','FRE-LAUNCH-Windows-x64-Setup.exe.sig',
                     'latest.json','SHA256SUMS.txt','PROVENANCE.json')
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Version already released; nothing will be replaced' }
          gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "FRE LAUNCH $version" --notes-file (Join-Path $stage 'NOTES.md') --draft
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create release draft' }
          foreach ($name in $files) {
            gh release upload $tag (Join-Path $stage $name) --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload $name; draft remains unpublished" }
          }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Unable to publish verified release' }
          Write-Host "Published $tag; the signed updater can now discover this release."
