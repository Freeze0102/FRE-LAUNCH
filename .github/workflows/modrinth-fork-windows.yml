name: Build FRE LAUNCH Modrinth Fork Windows
# The complete upstream-based source is on the separate modrinth-fork branch.
# Compiling Windows installers requires explicit manual dispatch.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modrinth-fork
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '12.11.2'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/app -> target'
      - name: Install workspace packages
        run: pnpm install --frozen-lockfile
      - name: Verify frontend source types
        run: pnpm --filter @modrinth/app-frontend run tsc:check
      - name: Build Tauri NSIS installer
        run: pnpm --filter @modrinth/app tauri build --bundles nsis
      - name: Print installer SHA256 hash
        shell: pwsh
        run: Get-ChildItem target/release/bundle/nsis -Filter '*.exe' -Recurse | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize
      - uses: actions/upload-artifact@v4
        with:
          name: FRE-LAUNCH-ModrinthFork-Windows-UNTESTED
          path: |
            target/release/bundle/nsis/*.exe
            apps/app/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
