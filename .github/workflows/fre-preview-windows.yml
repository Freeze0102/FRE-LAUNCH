name: FRE LAUNCH v0.5.17 Windows preview (not an updater)

# Preview builds are intentional manual operations, not every code push.
# This avoids wasting Windows runner time while native Minecraft is in review.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frelaunch-0514-preview
  cancel-in-progress: false

jobs:
  windows-preview:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout pinned FRE LAUNCH sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            vendor/fre-rust-source -> target
            FRE-Modrinth-Source -> target

      - name: Install pinned tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm.cmd install -g pnpm@12.11.2
          if ($LASTEXITCODE -ne 0) { throw 'pnpm setup failed' }
          python -m pip install 'Pillow>=11,<13'
          if ($LASTEXITCODE -ne 0) { throw 'Pillow setup failed' }

      - name: Prove Defender scanning works on this runner before any expensive build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = Join-Path $env:RUNNER_TEMP 'FRE-Defender-Probe.exe'
          Copy-Item -LiteralPath "$env:WINDIR/System32/cmd.exe" -Destination $probe
          & ./.github/scripts/scan-preview-defender.ps1 -Paths @($probe)

      - name: Preflight Vue source patch anchors before lengthy Rust compilation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $preflight = Join-Path $env:RUNNER_TEMP 'FRE-Preflight-Source'
          if (Test-Path -LiteralPath $preflight) { throw 'Unexpected existing preflight folder' }
          Copy-Item -LiteralPath 'vendor/modrinth' -Destination $preflight -Recurse -Force
          python scripts/modrinth-fork/prepare.py $preflight --upstream-sha 4ccf4d51804627cd0687ce7dfd5004f20c267acc
          if ($LASTEXITCODE -ne 0) { throw 'FRE LAUNCH source patch preflight failed' }
          python scripts/modrinth-fork/verify.py $preflight
          if ($LASTEXITCODE -ne 0) { throw 'FRE LAUNCH source verification preflight failed' }
          Write-Host 'All Vue/Rust integration patches applied to the pinned Modrinth source.'
          # Catch Vue/TypeScript regressions here, BEFORE compiling the 20-minute
          # native engine. This is the same full pinned source plus FRE patches.
          Push-Location $preflight
          try {
            pnpm.cmd --filter '@modrinth/app...' install --frozen-lockfile
            if ($LASTEXITCODE -ne 0) { throw 'Preflight workspace installation failed' }
            pnpm.cmd -w i18n:coverage
            if ($LASTEXITCODE -ne 0) { throw 'Preflight i18n generation failed' }
            pnpm.cmd --filter '@modrinth/app-frontend' run tsc:check
            if ($LASTEXITCODE -ne 0) { throw 'Preflight Vue typecheck failed' }
            pnpm.cmd --filter '@modrinth/app-frontend' exec vite build
            if ($LASTEXITCODE -ne 0) { throw 'Preflight Vite production frontend build failed' }
            node "$env:GITHUB_WORKSPACE/scripts/modrinth-fork/test_frontend.cjs" $preflight
            if ($LASTEXITCODE -ne 0) { throw 'Preflight content/profile regression tests failed' }
            node "$env:GITHUB_WORKSPACE/scripts/modrinth-fork/test_build_scripts.cjs" $preflight
            if ($LASTEXITCODE -ne 0) { throw 'Workflow / PowerShell syntax validation failed' }
          } finally { Pop-Location }
          # Verify the actual pinned Tauri 2.5 CLI options before costly Rust compilation.
          Push-Location $preflight
          try {
            $buildHelp = (& pnpm.cmd --filter '@modrinth/app' tauri build --help | Out-String)
            if ($LASTEXITCODE -ne 0) { throw 'Failed to inspect installed Tauri build options' }
            foreach ($requiredFlag in @('--ci', '--bundles', '--config')) {
              if (!$buildHelp.Contains($requiredFlag)) { throw "Unsupported Tauri option: $requiredFlag" }
            }
          } finally { Pop-Location }
          Write-Host 'Full Vue typecheck, component regressions, build-script syntax and Tauri option preflight passed.'

      - name: Restore already-compiled Windows preview when sources are identical
        id: preview-cache
        uses: actions/cache/restore@v4
        with:
          path: preview-pending
          key: frelaunch-0514-compiled-nsis-${{ hashFiles('scripts/modrinth-fork/*.ps1', 'vendor/fre-rust-source/FRE-VENDORED-SOURCE.json', 'scripts/modrinth-fork/*.py', 'scripts/modrinth-fork/*.rs', 'scripts/modrinth-fork/*.vue', 'scripts/modrinth-fork/*.ts', 'scripts/modrinth-fork/*.cjs', 'scripts/modrinth-fork/*.json', 'FRE-MODRINTH-LOCAL.ps1', 'update-channel.json') }}

      - name: Restore pinned native Rust engine if previously compiled
        id: rust-engine-cache
        uses: actions/cache/restore@v4
        with:
          path: scripts/modrinth-fork/fre-rust-runtime
          key: frelaunch-windows-x64-rust-975c07d9151847e6af13afc4b5ab37b6bbe78ef5-v3

      - name: Build MIT-only native game engine
        if: steps.preview-cache.outputs.cache-hit != 'true' && steps.rust-engine-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/modrinth-fork/ci-build-native-engine.ps1
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Native Rust engine compile failed' }
          if (Test-Path 'scripts/modrinth-fork/fre-rust-runtime/resources') {
            throw 'Proprietary Minecraft assets must never be uploaded'
          }

      - name: Cache compiled native engine before launcher compilation
        if: steps.preview-cache.outputs.cache-hit != 'true' && steps.rust-engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: scripts/modrinth-fork/fre-rust-runtime
          key: frelaunch-windows-x64-rust-975c07d9151847e6af13afc4b5ab37b6bbe78ef5-v3

      - name: Verify fresh or cached native engine digest and license
        if: steps.preview-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = 'scripts/modrinth-fork/fre-rust-runtime'
          $info = Get-Content -LiteralPath "$runtime/BUILD-INFO.json" -Raw | ConvertFrom-Json
          if ($info.source_commit -ne '975c07d9151847e6af13afc4b5ab37b6bbe78ef5' -or $info.engine_license -ne 'MIT') {
            throw 'Unexpected native engine revision or license'
          }
          foreach ($file in @('fre-rust-client.exe', 'fre-rust-prepare.exe', 'BUILD-INFO.json', 'LICENSE.txt', 'research-lock.json',
              'crates/fre-prepare/Cargo.toml', 'crates/fre-prepare/build.rs',
              'crates/fre-prepare/src/lib.rs', 'mods/fre/src/test/java/dev/frelaunch/parity/VanillaHeightmapOracle.java')) {
            if (!(Test-Path -LiteralPath (Join-Path $runtime $file) -PathType Leaf)) {
              throw "Native Rust engine missing $file"
            }
          }
          $digest = (Get-FileHash -LiteralPath "$runtime/fre-rust-client.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne $info.game_exe_sha256.ToLowerInvariant()) {
            throw 'Native Rust executable does not match verified build metadata'
          }
          $preparerDigest = (Get-FileHash -LiteralPath "$runtime/fre-rust-prepare.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ([string]$info.prepare_exe_sha256 -notmatch '^[A-Fa-f0-9]{64}$' -or
              $preparerDigest -ne $info.prepare_exe_sha256.ToLowerInvariant()) {
            throw 'Native resource preparer does not match verified build metadata'
          }
          if (Test-Path -LiteralPath "$runtime/resources") { throw 'Public builds must not contain proprietary Minecraft resources' }

      - name: Prepare and verify source without signing keys
        if: steps.preview-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./FRE-MODRINTH-LOCAL.ps1
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Source generation failed' }
          Push-Location FRE-Modrinth-Source
          try {
            pnpm.cmd --filter '@modrinth/app...' install --frozen-lockfile
            if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
            pnpm.cmd -w i18n:coverage
            if ($LASTEXITCODE -ne 0) { throw 'Translation generation failed' }
            pnpm.cmd --filter '@modrinth/app-frontend' run tsc:check
            if ($LASTEXITCODE -ne 0) { throw 'Vue typecheck failed' }
            pnpm.cmd --filter '@modrinth/app-frontend' exec vite build
            if ($LASTEXITCODE -ne 0) { throw 'Frontend required by Rust test codegen failed' }
            cargo test --locked -p theseus_gui
            if ($LASTEXITCODE -ne 0) { throw 'FRE native backend unit tests failed' }
            node ../scripts/modrinth-fork/test_frontend.cjs .
            if ($LASTEXITCODE -ne 0) { throw 'Content and profile regression tests failed' }
          } finally { Pop-Location }

      - name: Build independent preview without updater signatures
        if: steps.preview-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location FRE-Modrinth-Source
          try {
            # Preview is a standalone unsigned installer, never a signed updater.
            # The pinned Tauri 2.5 CLI has no --no-sign flag; use this override.
            $env:TAURI_SIGNING_PRIVATE_KEY = $null
            $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = $null
            $configFile = 'apps/app/tauri.preview.conf.json'
            Set-Content -LiteralPath $configFile -Value '{"build":{"beforeBuildCommand":""},"bundle":{"createUpdaterArtifacts":false}}' -Encoding utf8
            if ((Get-Content -LiteralPath $configFile -Raw | ConvertFrom-Json).bundle.createUpdaterArtifacts -ne $false) {
              throw 'Preview config must disable signed updater artifacts'
            }
            pnpm.cmd --filter '@modrinth/app' tauri build --ci --bundles nsis --config tauri.preview.conf.json
            if ($LASTEXITCODE -ne 0) { throw 'Unsigned preview installer build failed' }
          } finally { Pop-Location }

      - name: Preserve completed unsigned binaries for cheap scan or smoke retries
        if: steps.preview-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem 'FRE-Modrinth-Source/target/release/bundle/nsis' -File -Filter '*.exe')
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installers.Count)" }
          $launcher = 'FRE-Modrinth-Source/target/release/FRE LAUNCH.exe'
          if (-not (Test-Path -LiteralPath $launcher -PathType Leaf)) { throw 'Compiled Windows launcher missing' }
          New-Item -ItemType Directory -Path preview-pending -Force | Out-Null
          Copy-Item -LiteralPath $installers[0].FullName -Destination 'preview-pending/FRE-LAUNCH-v0.5.17-Windows-x64-Setup.exe'
          Copy-Item -LiteralPath $launcher -Destination 'preview-pending/FRE LAUNCH.exe'
          $engine = 'scripts/modrinth-fork/fre-rust-runtime/fre-rust-client.exe'
          if (-not (Test-Path -LiteralPath $engine -PathType Leaf)) { throw 'Native Rust client missing from bundle' }
          Copy-Item -LiteralPath $engine -Destination 'preview-pending/fre-rust-client.exe'
          $preparer = 'scripts/modrinth-fork/fre-rust-runtime/fre-rust-prepare.exe'
          if (-not (Test-Path -LiteralPath $preparer -PathType Leaf)) { throw 'Native resource preparer missing from build' }
          Copy-Item -LiteralPath $preparer -Destination 'preview-pending/fre-rust-prepare.exe'
          $hashes = foreach ($name in @('FRE-LAUNCH-v0.5.17-Windows-x64-Setup.exe', 'FRE LAUNCH.exe', 'fre-rust-client.exe', 'fre-rust-prepare.exe')) {
            $digest = (Get-FileHash -LiteralPath (Join-Path 'preview-pending' $name) -Algorithm SHA256).Hash
            "$name|$digest"
          }
          Set-Content -LiteralPath 'preview-pending/SHA256-MANIFEST.txt' -Value $hashes -Encoding utf8

      - name: Cache compiled preview before external security checks
        if: steps.preview-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: preview-pending
          key: frelaunch-0514-compiled-nsis-${{ hashFiles('scripts/modrinth-fork/*.ps1', 'vendor/fre-rust-source/FRE-VENDORED-SOURCE.json', 'scripts/modrinth-fork/*.py', 'scripts/modrinth-fork/*.rs', 'scripts/modrinth-fork/*.vue', 'scripts/modrinth-fork/*.ts', 'scripts/modrinth-fork/*.cjs', 'scripts/modrinth-fork/*.json', 'FRE-MODRINTH-LOCAL.ps1', 'update-channel.json') }}

      - name: Verify compiled preview cache and check file integrity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = 'preview-pending/SHA256-MANIFEST.txt'
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) { throw 'Preview digest manifest missing' }
          $expectedNames = @('FRE-LAUNCH-v0.5.17-Windows-x64-Setup.exe', 'FRE LAUNCH.exe', 'fre-rust-client.exe', 'fre-rust-prepare.exe')
          $entries = @(Get-Content -LiteralPath $manifest)
          if ($entries.Count -ne $expectedNames.Count) { throw 'Incorrect preview digest manifest' }
          foreach ($i in 0..($expectedNames.Count - 1)) {
            $fields = @($entries[$i] -split '\|', 2)
            if ($fields.Count -ne 2 -or $fields[0] -cne $expectedNames[$i] -or $fields[1] -notmatch '^[0-9A-Fa-f]{64}$') {
              throw 'Unexpected preview manifest entry'
            }
            $actual = (Get-FileHash -LiteralPath (Join-Path 'preview-pending' $fields[0]) -Algorithm SHA256).Hash
            if ($actual -ine $fields[1]) { throw "Cached preview SHA-256 mismatch: $($fields[0])" }
          }
          "PREVIEW_INSTALLER=$((Resolve-Path -LiteralPath 'preview-pending/FRE-LAUNCH-v0.5.17-Windows-x64-Setup.exe').ProviderPath)" >> $env:GITHUB_ENV

      - name: Scan preview with Microsoft Defender before sharing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'preview-pending/FRE-LAUNCH-v0.5.17-Windows-x64-Setup.exe',
            'preview-pending/FRE LAUNCH.exe',
            'preview-pending/fre-rust-client.exe',
            'preview-pending/fre-rust-prepare.exe'
          )
          & ./.github/scripts/scan-preview-defender.ps1 -Paths $files

      - name: Smoke-test clean preview installation and launch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:RUNNER_TEMP 'FRELaunch0514Preview'
          $installer = Start-Process -FilePath $env:PREVIEW_INSTALLER -ArgumentList @('/S',"/D=$folder") -WindowStyle Hidden -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Preview installer failed: $($installer.ExitCode)" }
          # The bundled native Rust game is also an EXE. Launch exactly FRE LAUNCH,
          # never the largest arbitrary bundled program.
          $executables = @(Get-ChildItem -LiteralPath $folder -Recurse -File -Filter 'FRE LAUNCH.exe')
          if ($executables.Count -ne 1) { throw "Expected one installed FRE LAUNCH.exe, found $($executables.Count)" }
          $app = Start-Process -FilePath $executables[0].FullName -PassThru
          Start-Sleep -Seconds 12
          $app.Refresh()
          if ($app.HasExited) { throw "Preview launcher exited unexpectedly: $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force

      - name: Stage reviewed preview only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path preview-artifacts | Out-Null
          $target = 'preview-artifacts/FRE-LAUNCH-v0.5.17-PREVIEW-Windows-x64-Setup.exe'
          Copy-Item -LiteralPath $env:PREVIEW_INSTALLER -Destination $target
          (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content -LiteralPath 'preview-artifacts/SHA256.txt'
          $notes = @(
            "FRE LAUNCH v0.5.17 preview from main commit $env:GITHUB_SHA."
            'UNSIGNED TEST BUILD, not a signed update for installed v0.5.9.'
            'Microsoft Defender scan and clean installation startup smoke passed in Windows CI.'
            'Includes Java in-app Modrinth catalog, optional approved-key CurseForge search,'
            'FRE-owned Minecraft 26.3 Rust profiles; no external launcher or separate login.'
            'This preview never contains private Minecraft game resources.'
            'To publish an automatic update, restore the ORIGINAL 0.5.9 Tauri signing key.'
          )
          Set-Content -LiteralPath 'preview-artifacts/README.txt' -Value $notes -Encoding utf8

      - name: Upload Windows preview (not official release)
        uses: actions/upload-artifact@v4
        with:
          name: FRE-LAUNCH-v0.5.17-PREVIEW-Windows
          path: preview-artifacts/
          if-no-files-found: error
          retention-days: 7
