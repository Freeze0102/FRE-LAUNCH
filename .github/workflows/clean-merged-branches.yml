name: Clean merged branches

# Cleanup is opt-in: avoid consuming Actions minutes on every commit.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview branch cleanup without deleting anything"
        required: false
        type: boolean
        default: true

# Never delete a branch from an unmerged PR or one with newer commits.
permissions:
  contents: write
  pull-requests: read

concurrency:
  group: clean-merged-branches
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete only exact merged PR heads
        uses: actions/github-script@v8
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const dryRun = process.env.DRY_RUN === 'true';
            const meta = await github.rest.repos.get({ owner, repo });
            const defaultBranch = meta.data.default_branch;

            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 }
            );
            const closedPRs = await github.paginate(
              github.rest.pulls.list,
              { owner, repo, state: 'closed', per_page: 100 }
            );

            const activePRs = await github.paginate(
              github.rest.pulls.list,
              { owner, repo, state: 'open', per_page: 100 }
            );
            // One-time cleanup explicitly requested by the repository owner.
            // Match full SHAs to avoid deleting newly updated/unmerged work.
            const obsolete = new Map([
              ['feat/quilt-loader','352493ae3be80e1f3662efc2c6a8ea08403bcbe4'],
              ['feat/screenshot-gallery','67b6437dc4b09c863de58e1169df589cc1373abe'],
              ['feat/screenshot-gallery-repair','7e089a66a119965545bd8b0d599ccbfebcc90dfa'],
              ['feat/screenshot-gallery-v04','f1e0b804e1e2ae6688eda219b268828ea0901d43'],
              ['fix/install-control-v05-rebased','deda7617878e36ddac1c48afe90266237067d597'],
              ['fix/install-crash-breadcrumbs','8621275dd0eb48704d172c2b4cb1116bb10be1aa'],
              ['fix/minecraft-install-resilience','f7d738e140a64e00eaecd711e9855faa270ee412']
            ]);

            const active = new Set(activePRs
              .filter(pr => pr.head.repo?.full_name === `${owner}/${repo}`)
              .map(pr => pr.head.ref));

            let deleted = 0;
            let skipped = 0;
            for (const branch of branches) {
              const name = branch.name;
              if (name === defaultBranch || branch.protected || active.has(name)) {
                skipped++;
                continue;
              }
              const mergedExactPR = closedPRs.some(pr =>
                !!pr.merged_at &&
                pr.head.repo?.full_name === `${owner}/${repo}` &&
                pr.head.ref === name &&
                pr.head.sha === branch.commit.sha
              );
              const knownObsolete = obsolete.get(name) === branch.commit.sha;
              if (!mergedExactPR && !knownObsolete) {
                core.info(`Preserving ${name}: branch not merged or updated after cleanup approval`);
                skipped++;
                continue;
              }
              if (dryRun) {
                core.info(`Would delete merged branch: ${name}`);
                continue;
              }
              try {
                await github.rest.git.deleteRef({owner, repo, ref: `heads/${name}`});
                core.info(`Deleted merged branch: ${name}`);
                deleted++;
              } catch (error) {
                core.warning(`Could not delete ${name}: ${error.message}`);
              }
            }
            core.summary.addHeading('FRE LAUNCH — branch cleanup')
              .addRaw(`Dry run: ${dryRun}\n\nDeleted: ${deleted}\n\nPreserved: ${skipped}\n`)
              .write();
