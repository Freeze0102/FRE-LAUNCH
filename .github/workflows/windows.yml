name: Legacy React Windows Build (NOT Vue Rust Update)
# Historical React launcher only. For Vue/Rust signed updates use fre-modrinth-rust-update.yml.
# Heavy Windows installers consume private-repository Actions minutes.
# Run only when explicitly requested in GitHub -> Actions -> Windows Build.
on:
  workflow_dispatch:

permissions:
  contents: write

# Set Actions variable FRE_LAUNCH_RELEASE_REPO to an existing public repo.
# Set Actions secret FRE_RELEASE_TOKEN (Contents write on that repo).
env:
  FRE_LAUNCH_RELEASE_REPO: ${{ vars.FRE_LAUNCH_RELEASE_REPO }}
  # Public application UUID only. Requires independent Minecraft Services approval.
  FRE_MS_CLIENT_ID: ${{ vars.FRE_MS_CLIENT_ID }}

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Keep CI feedback focused on the newest commit; old installer runs are obsolete.
  cancel-in-progress: true


jobs:
  quarantine-flagged-release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Keep flagged v0.5.5 installer unavailable pending malware investigation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v0.5.5 --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit v0.5.5 --repo "$GH_REPO" --draft \
              --notes "SECURITY HOLD: Windows Defender reported Trojan:Win32/Bearfoos.B!ml for the 0.5.5 administrator installer. Do not download, run or restore the installer. Await investigation and a separately reviewed release."
            echo "v0.5.5 has been converted to a draft pending investigation."
          else
            echo "No v0.5.5 release to quarantine in this repository."
          fi
      - name: Retire v0.5.5 build archives from earlier Windows Actions run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Preserve the original binary in the private draft release for analysis;
          # remove old automatically downloadable CI ZIPs of the flagged version.
          for id in 12506165770 12505821468 12504834056; do
            if gh api "repos/$GH_REPO/actions/artifacts/$id" >/dev/null 2>&1; then
              gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$id"
              echo "Retired artifact $id"
            else
              echo "Artifact $id was already absent"
            fi
          done

  build:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false # No lockfile; keep setup-node from enabling unsafe auto-cache
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Verify TypeScript
        run: npm run check
      - name: Build frontend
        run: npm run build
      - name: Smoke-test real Mojang release metadata and asset integrity
        run: node scripts/smoke-mojang.mjs
      - name: Generate application icons
        run: npm run tauri icon src-tauri/icons/app.svg
      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build standard non-admin Windows installer
        run: npm run tauri build
      - name: Verify PE executable reserves 8 MiB stack for WebView2
        shell: pwsh
        run: |
          $path = "src-tauri/target/release/fre-launch.exe"
          if (!(Test-Path $path)) { throw "Compiled Windows EXE not found" }
          $stream = [System.IO.File]::OpenRead((Resolve-Path $path).Path)
          $reader = [System.IO.BinaryReader]::new($stream)
          try {
            $stream.Position = 0x3c
            $pe = $reader.ReadInt32()
            if ($pe -lt 0x40 -or $pe -gt $stream.Length - 0x100) {
              throw "Invalid PE header offset"
            }
            $stream.Position = $pe
            if ($reader.ReadUInt32() -ne 0x00004550) { throw "Missing PE signature" }
            $stream.Position = $pe + 24
            if ($reader.ReadUInt16() -ne 0x20b) { throw "Expected x64 PE32+ binary" }
            $stream.Position = $pe + 24 + 72
            $reserved = $reader.ReadUInt64()
            Write-Host "Windows main-thread stack reserve: $reserved bytes"
            if ($reserved -lt 8MB) {
              throw "FRE LAUNCH must reserve >= 8 MiB stack for WebView2; expected /STACK:8388608"
            }
          } finally {
            $reader.Dispose()
          }
      - name: Stage standard installer for smoke test and download
        shell: pwsh
        run: |
          $base = "src-tauri/target/release/bundle/nsis"
          $file = Get-ChildItem $base -File -Filter "*.exe" | Select-Object -First 1
          if (!$file) { throw "NSIS current-user installer not found" }
          New-Item -ItemType Directory -Force -Path "$base/current-user" | Out-Null
          Copy-Item $file.FullName "$base/current-user/FRE-LAUNCH-CurrentUser-Setup.exe"
      - name: Security gate - Defender scan before running any FRE executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Get-Command Get-MpComputerStatus -ErrorAction SilentlyContinue)) {
            throw 'Microsoft Defender is not available on this runner. Security scanning cannot be bypassed.'
          }
          $status = Get-MpComputerStatus -ErrorAction Stop
          if (!$status.AMServiceEnabled -or !$status.AntivirusEnabled) {
            throw 'Defender antivirus engine is not enabled. Refusing to test or publish unscanned executable.'
          }
          Update-MpSignature -ErrorAction Stop
          $status = Get-MpComputerStatus -ErrorAction Stop
          Write-Host "Defender AV definitions: $($status.AntivirusSignatureVersion)"
          $file = "src-tauri/target/release/fre-launch.exe"
          if (!(Test-Path $file)) { throw "Missing scan target: $file" }
          Start-MpScan -ScanType CustomScan -ScanPath (Resolve-Path $file).Path -ErrorAction Stop
          if (!(Test-Path $file)) { throw "Defender removed or quarantined: $file" }
          $file = "src-tauri/target/release/bundle/nsis/current-user/FRE-LAUNCH-CurrentUser-Setup.exe"
          if (!(Test-Path $file)) { throw "Missing scan target: $file" }
          Start-MpScan -ScanType CustomScan -ScanPath (Resolve-Path $file).Path -ErrorAction Stop
          if (!(Test-Path $file)) { throw "Defender removed or quarantined: $file" }
          $threats = @(Get-MpThreatDetection -ErrorAction Stop)
          if ($threats.Count -gt 0) {
            $threats | Format-List ThreatID,ThreatStatusID,Resources | Out-String | Write-Host
            throw 'Defender recorded a malware detection: installers must not be published.'
          }
          Write-Host 'Defender scan passed; no detections reported on this runner'
      - name: Smoke-test installing in a custom Windows directory
        shell: pwsh
        timeout-minutes: 4
        run: |
          $file = "src-tauri/target/release/bundle/nsis/current-user/FRE-LAUNCH-CurrentUser-Setup.exe"
          $folder = Join-Path $env:RUNNER_TEMP "FRELaunchSmoke"
          # NSIS /D must be last and unquoted. Runner temp has no spaces.
          $process = Start-Process -FilePath $file -ArgumentList @("/S", "/D=$folder") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS silent installer exit code $($process.ExitCode)" }
          if (!(Test-Path (Join-Path $folder "fre-launch.exe"))) {
            throw "Installer exited but fre-launch.exe was not installed at the requested path"
          }
          Write-Host "NSIS installed to custom path: $folder"
      - name: Enable local Windows crash minidumps
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP "FRELaunchCrashDumps"
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          $key = "HKCU:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\fre-launch.exe"
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -Value $folder -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -Value 4 -PropertyType DWord -Force | Out-Null
          Write-Host "Minidump directory: $folder"
      - name: Prepare Windows ProcDump crash monitor
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP "FRELaunchCrashDumps"
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "procdump.zip"
          $out = Join-Path $env:RUNNER_TEMP "SysinternalsProcDump"
          try {
            Invoke-WebRequest -Uri "https://download.sysinternals.com/files/Procdump.zip" -OutFile $zip -TimeoutSec 45
            Expand-Archive -LiteralPath $zip -DestinationPath $out -Force
            if (!(Test-Path (Join-Path $out "procdump64.exe"))) {
              Write-Warning "ProcDump download did not include the x64 binary"
            }
          } catch {
            Write-Warning "ProcDump setup unavailable; WER fallback remains enabled: $_"
          }
      - name: Smoke-test launcher normal and WebView2 recovery startup
        shell: pwsh
        timeout-minutes: 3
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "FRELaunchSmoke/fre-launch.exe"
          if (!(Test-Path $exe)) { throw "Installed EXE missing" }
          $attempts = @()
          $startTime = (Get-Date).AddSeconds(-3)
          $folder = Join-Path $env:RUNNER_TEMP "FRELaunchCrashDumps"
          $procdump = Join-Path $env:RUNNER_TEMP "SysinternalsProcDump/procdump64.exe"
          $monitor = $null
          if (Test-Path $procdump) {
            try {
              # Monitor unhandled exceptions (including 0xC00000FD) independently
              # from Windows Error Reporting, which CI runners may disable.
              $monitor = Start-Process -FilePath $procdump -ArgumentList @("-accepteula","-mm","-e","-w","fre-launch.exe",$folder) -PassThru
              Start-Sleep -Seconds 3
              Write-Host "ProcDump monitor started (PID $($monitor.Id))"
            } catch { Write-Warning "Could not start ProcDump monitor: $_" }
          }
          foreach ($mode in @("normal", "recovery")) {
            if ($mode -eq "recovery") {
              $env:FRE_LAUNCH_FORCE_SOFTWARE = "1"
            }
            Write-Host "Starting FRE LAUNCH in $mode mode"
            $p = Start-Process -FilePath $exe -PassThru
            Start-Sleep -Seconds 12
            $p.Refresh()
            if ($p.HasExited) {
              $hexCode = "0x{0:X8}" -f ([uint32]([int64]$p.ExitCode -band 0xffffffffL))
              Write-Warning "Launcher $mode exited before 12 seconds: $hexCode"
              $attempts += "$mode exited $hexCode"
            } else {
              Write-Host "Launcher $mode survived 12 seconds (PID $($p.Id))"
              $attempts += "$mode alive"
              Stop-Process -Id $p.Id -Force
            }
          }
          Remove-Item Env:FRE_LAUNCH_FORCE_SOFTWARE -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          if ($monitor) {
            $monitor.Refresh()
            if (!$monitor.HasExited) { Stop-Process -Id $monitor.Id -Force -ErrorAction SilentlyContinue }
          }
          Write-Host "Saved minidumps: $(@(Get-ChildItem $folder -File -Filter '*.dmp' -ErrorAction SilentlyContinue).Count)"
          $log = Join-Path $env:LOCALAPPDATA "FRE-LAUNCH/startup.log"
          if (Test-Path $log) {
            Write-Host "=== FRE LAUNCH bootstrap log ==="
            Get-Content $log -Tail 100 | Write-Host
          }
          Write-Host "=== Windows Application crash events ==="
          try {
            Get-WinEvent -FilterHashtable @{LogName="Application"; StartTime=$startTime} -ErrorAction Stop |
              Where-Object { $_.Message -match 'fre-launch|msedgewebview2|0xc00000fd' } |
              Select-Object -First 8 -ExpandProperty Message | ForEach-Object { Write-Host $_ }
          } catch { Write-Warning "Event log unavailable: $_" }
          if ($attempts[0] -ne "normal alive") {
            throw "Normal launcher startup failed. Recovery result: $($attempts[1]). Release intentionally blocked."
          }
          if ($attempts[1] -ne "recovery alive") {
            throw "WebView2 recovery startup failed too. Release intentionally blocked."
          }
      - name: Upload crash files before analysis
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: FRE-LAUNCH-Native-Startup-Dumps
          path: ${{ runner.temp }}/FRELaunchCrashDumps/*.dmp
          if-no-files-found: warn
          retention-days: 1
      - name: Inspect native Windows crash dump
        if: failure()
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP "FRELaunchCrashDumps"
          $dumps = @(Get-ChildItem $folder -File -Filter "*.dmp" -ErrorAction SilentlyContinue)
          Write-Host "Crash minidump count: $($dumps.Count)"
          $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          if (!$dumps.Count) {
            Write-Warning "No Windows crash dumps were created"
          } elseif (!(Test-Path $cdb)) {
            Write-Warning "Windows Debugger not installed; upload saved minidumps for symbols"
          } else {
            foreach ($dump in $dumps | Select-Object -First 2) {
              Write-Host "===== Crash stack for $($dump.Name) ====="
              & $cdb -z $dump.FullName -c ".symfix; .reload; !analyze -v; kv 45; q" 2>&1 | Select-Object -Last 180 | Write-Host
            }
          }
      - name: Upload startup crash minidumps
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: FRE-LAUNCH-Windows-Startup-Crashes
          path: ${{ runner.temp }}/FRELaunchCrashDumps/*.dmp
          if-no-files-found: warn
          retention-days: 1
      - name: Remove first NSIS installer before admin build
        shell: pwsh
        run: |
          Get-ChildItem "src-tauri/target/release/bundle/nsis" -File -Filter "*.exe" | Remove-Item -Force
      - name: Build alternative all-users installer
        run: npm run tauri build -- --config src-tauri/tauri.admin.conf.json
      - name: Stage administrator installer
        shell: pwsh
        run: |
          $base = "src-tauri/target/release/bundle/nsis"
          $file = Get-ChildItem $base -File -Filter "*.exe" | Select-Object -First 1
          if (!$file) { throw "NSIS administrator installer not found" }
          New-Item -ItemType Directory -Force -Path "$base/administrator" | Out-Null
          Copy-Item $file.FullName "$base/administrator/FRE-LAUNCH-Administrator-Setup.exe"
      - name: Security gate - Defender scan administrator installer before publishing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Get-Command Get-MpComputerStatus -ErrorAction SilentlyContinue)) {
            throw 'Microsoft Defender is not available on this runner. Security scanning cannot be bypassed.'
          }
          $status = Get-MpComputerStatus -ErrorAction Stop
          if (!$status.AMServiceEnabled -or !$status.AntivirusEnabled) {
            throw 'Defender antivirus engine is not enabled. Refusing to test or publish unscanned executable.'
          }
          Write-Host "Defender AV definitions: $($status.AntivirusSignatureVersion)"
          $file = "src-tauri/target/release/bundle/nsis/administrator/FRE-LAUNCH-Administrator-Setup.exe"
          if (!(Test-Path $file)) { throw "Missing scan target: $file" }
          Start-MpScan -ScanType CustomScan -ScanPath (Resolve-Path $file).Path -ErrorAction Stop
          if (!(Test-Path $file)) { throw "Defender removed or quarantined: $file" }
          $threats = @(Get-MpThreatDetection -ErrorAction Stop)
          if ($threats.Count -gt 0) {
            $threats | Format-List ThreatID,ThreatStatusID,Resources | Out-String | Write-Host
            throw 'Defender recorded a malware detection: installers must not be published.'
          }
          Write-Host 'Defender scan passed; no detections reported on this runner'
      # CI artifacts remain private to the source repository and are offered
      # for investigation ONLY. This is not a release or an installation approval.
      # Both installers and the portable EXE passed Defender on the runner above.
      - name: Stage Windows binaries for independent security review
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          if ($version -ne '0.5.7') {
            throw "This security-review workflow is pinned to v0.5.7, not $version. Reassess before changing versions."
          }
          $root = 'src-tauri/target/release/security-review'
          New-Item -Path $root -ItemType Directory -Force | Out-Null
          $files = @(
            @('src-tauri/target/release/bundle/nsis/current-user/FRE-LAUNCH-CurrentUser-Setup.exe', 'FRE-LAUNCH-CurrentUser-Setup.exe'),
            @('src-tauri/target/release/bundle/nsis/administrator/FRE-LAUNCH-Administrator-Setup.exe', 'FRE-LAUNCH-Administrator-Setup.exe'),
            @('src-tauri/target/release/fre-launch.exe', 'fre-launch.exe')
          )
          $hashes = @()
          foreach ($pair in $files) {
            if (!(Test-Path $pair[0])) { throw "Missing reviewed binary: $($pair[0])" }
            $destination = Join-Path $root $pair[1]
            Copy-Item -LiteralPath $pair[0] -Destination $destination -Force
            $hash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
            $hashes += "$hash  $($pair[1])"
            Write-Host "Review-only SHA256: $($pair[1]) = $hash"
          }
          $hashes | Set-Content -LiteralPath (Join-Path $root 'SHA256SUMS.txt') -Encoding ascii
          Copy-Item -LiteralPath 'SECURITY_NOTICE.md' -Destination (Join-Path $root 'SECURITY_NOTICE.md')
          $warning = @(
            'SECURITY REVIEW ONLY — NOT CLEARED FOR INSTALLATION',
            'FRE LAUNCH v0.5.7, Windows x64.',
            'These binaries were built and checked with Microsoft Defender on the GitHub Actions runner.',
            'This does not establish that they are malware-free.',
            'The v0.5.5 administrator installer triggered Trojan:Win32/Bearfoos.B!ml on a user computer.',
            'DO NOT RUN OR INSTALL until the original detection and these binaries have independent review.',
            'Do not disable or bypass Windows Defender.',
            'See SHA256SUMS.txt and SECURITY_NOTICE.md. Public releases remain manually gated.'
          )
          $warning | Set-Content -LiteralPath (Join-Path $root 'READ_BEFORE_USING.txt') -Encoding utf8
      - name: Upload v0.5.6 binaries for security review only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: FRE-LAUNCH-0.5.7-SECURITY-REVIEW-ONLY
          path: src-tauri/target/release/security-review/
          if-no-files-found: error
          retention-days: 7
      - name: Publish versioned Windows release for in-app updates
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.FRE_LAUNCH_SECURITY_APPROVED == 'true' && !cancelled()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_RELEASE_TOKEN: ${{ secrets.FRE_RELEASE_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $repo = if ($env:FRE_LAUNCH_RELEASE_REPO) { $env:FRE_LAUNCH_RELEASE_REPO.Trim() } else { $env:GITHUB_REPOSITORY }
          $target = if ($repo -eq $env:GITHUB_REPOSITORY) { $env:GITHUB_SHA } else { 'main' }
          if ($repo -ne $env:GITHUB_REPOSITORY) {
            if (!$env:PUBLIC_RELEASE_TOKEN) { throw 'FRE_RELEASE_TOKEN must have Contents write on the public distribution repository' }
            $env:GH_TOKEN = $env:PUBLIC_RELEASE_TOKEN
          } else {
            Write-Warning 'Private source repository cannot serve anonymous in-app updates; configure a public FRE_LAUNCH_RELEASE_REPO.'
          }
          $normal = 'src-tauri/target/release/bundle/nsis/current-user/FRE-LAUNCH-CurrentUser-Setup.exe'
          $admin = 'src-tauri/target/release/bundle/nsis/administrator/FRE-LAUNCH-Administrator-Setup.exe'
          foreach ($file in @($normal, $admin)) {
            if (!(Test-Path $file)) { throw "Missing Windows installer: $file" }
            $digest = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            [System.IO.File]::WriteAllText((Join-Path (Get-Location) "$file.sha256"), $digest, [System.Text.Encoding]::ASCII)
            Write-Host "Release SHA256 for $file is $digest"
          }
          # Keep previously published releases immutable. Bump app version for a new release.
          $published = @(gh release list --repo $repo --json tagName --limit 100 | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw 'Could not list release tags' }
          if (@($published | Where-Object { $_.tagName -eq $tag }).Count -gt 0) {
            Write-Host "Existing $tag release is unchanged."
          } else {
            gh release create $tag $normal "$normal.sha256" $admin "$admin.sha256" --repo $repo --target $target --title "FRE LAUNCH $version" --notes "FRE LAUNCH $version for Windows. Includes user/admin installers and SHA256 files for in-app updates. Existing Minecraft data is preserved by normal upgrades." --latest
            if ($LASTEXITCODE -ne 0) { throw "Could not publish GitHub release $tag" }
          }
