name: Windows Build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Keep CI feedback focused on the newest commit; old installer runs are obsolete.
  cancel-in-progress: true


jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false # No lockfile; keep setup-node from enabling unsafe auto-cache
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Verify TypeScript
        run: npm run check
      - name: Build frontend
        run: npm run build
      - name: Smoke-test real Mojang release metadata and asset integrity
        run: node scripts/smoke-mojang.mjs
      - name: Generate application icons
        run: npm run tauri icon src-tauri/icons/app.svg
      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build standard non-admin Windows installer
        run: npm run tauri build
      - name: Stage standard installer for smoke test and download
        shell: pwsh
        run: |
          $base = "src-tauri/target/release/bundle/nsis"
          $file = Get-ChildItem $base -File -Filter "*.exe" | Select-Object -First 1
          if (!$file) { throw "NSIS current-user installer not found" }
          New-Item -ItemType Directory -Force -Path "$base/current-user" | Out-Null
          Copy-Item $file.FullName "$base/current-user/FRE-LAUNCH-CurrentUser-Setup.exe"
      - name: Smoke-test installing in a custom Windows directory
        shell: pwsh
        timeout-minutes: 4
        run: |
          $file = "src-tauri/target/release/bundle/nsis/current-user/FRE-LAUNCH-CurrentUser-Setup.exe"
          $folder = Join-Path $env:RUNNER_TEMP "FRELaunchSmoke"
          # NSIS /D must be last and unquoted. Runner temp has no spaces.
          $process = Start-Process -FilePath $file -ArgumentList @("/S", "/D=$folder") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS silent installer exit code $($process.ExitCode)" }
          if (!(Test-Path (Join-Path $folder "fre-launch.exe"))) {
            throw "Installer exited but fre-launch.exe was not installed at the requested path"
          }
          Write-Host "NSIS installed to custom path: $folder"
      - name: Build alternative all-users installer
        run: npm run tauri build -- --config src-tauri/tauri.admin.conf.json
      - name: Stage administrator installer
        shell: pwsh
        run: |
          $base = "src-tauri/target/release/bundle/nsis"
          $file = Get-ChildItem $base -File -Filter "*.exe" | Select-Object -First 1
          if (!$file) { throw "NSIS administrator installer not found" }
          New-Item -ItemType Directory -Force -Path "$base/administrator" | Out-Null
          Copy-Item $file.FullName "$base/administrator/FRE-LAUNCH-Administrator-Setup.exe"
      - name: Upload non-admin Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: FRE-LAUNCH-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/current-user/*.exe
          if-no-files-found: error
      - name: Upload administrator Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: FRE-LAUNCH-Windows-Admin-Installer
          path: src-tauri/target/release/bundle/nsis/administrator/*.exe
          if-no-files-found: error
      - name: Upload portable Windows executable
        uses: actions/upload-artifact@v6
        with:
          name: FRE-LAUNCH-Windows-Portable
          path: src-tauri/target/release/fre-launch.exe
          if-no-files-found: warn
      - name: Publish versioned Windows release for in-app updates
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $normal = 'src-tauri/target/release/bundle/nsis/current-user/FRE-LAUNCH-CurrentUser-Setup.exe'
          $admin = 'src-tauri/target/release/bundle/nsis/administrator/FRE-LAUNCH-Administrator-Setup.exe'
          foreach ($file in @($normal, $admin)) {
            if (!(Test-Path $file)) { throw "Missing Windows installer: $file" }
            $digest = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            [System.IO.File]::WriteAllText((Join-Path (Get-Location) "$file.sha256"), $digest, [System.Text.Encoding]::ASCII)
            Write-Host "Release SHA256 for $file is $digest"
          }
          # Keep previously published releases immutable. Bump app version for a new release.
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Existing $tag release is unchanged."
          } else {
            gh release create $tag $normal "$normal.sha256" $admin "$admin.sha256" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "FRE LAUNCH $version" --notes "FRE LAUNCH $version for Windows. Includes user/admin installers and SHA256 files for in-app updates. Existing Minecraft data is preserved by normal upgrades." --latest
            if ($LASTEXITCODE -ne 0) { throw "Could not publish GitHub release $tag" }
          }
