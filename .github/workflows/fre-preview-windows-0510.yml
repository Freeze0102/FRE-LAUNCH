name: FRE LAUNCH v0.5.10 Windows preview (not an updater)

on:
  push:
    branches:
      - main
    paths:
      - '.github/release-requests/v0.5.10-preview'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frelaunch-0510-preview
  cancel-in-progress: false

jobs:
  windows-preview:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout pinned FRE LAUNCH sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            vendor/fre-rust-source -> target
            FRE-Modrinth-Source -> target

      - name: Install pinned tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm.cmd install -g pnpm@12.11.2
          if ($LASTEXITCODE -ne 0) { throw 'pnpm setup failed' }
          python -m pip install 'Pillow>=11,<13'
          if ($LASTEXITCODE -ne 0) { throw 'Pillow setup failed' }

      - name: Preflight Vue source patch anchors before lengthy Rust compilation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $preflight = Join-Path $env:RUNNER_TEMP 'FRE-Preflight-Source'
          if (Test-Path -LiteralPath $preflight) { throw 'Unexpected existing preflight folder' }
          Copy-Item -LiteralPath 'vendor/modrinth' -Destination $preflight -Recurse -Force
          python scripts/modrinth-fork/prepare.py $preflight --upstream-sha 4ccf4d51804627cd0687ce7dfd5004f20c267acc
          if ($LASTEXITCODE -ne 0) { throw 'FRE LAUNCH source patch preflight failed' }
          python scripts/modrinth-fork/verify.py $preflight
          if ($LASTEXITCODE -ne 0) { throw 'FRE LAUNCH source verification preflight failed' }
          Write-Host 'All Vue/Rust integration patches applied to the pinned Modrinth source.'
          # Catch Vue/TypeScript regressions here, BEFORE compiling the 20-minute
          # native engine. This is the same full pinned source plus FRE patches.
          Push-Location $preflight
          try {
            pnpm.cmd --filter '@modrinth/app...' install --frozen-lockfile
            if ($LASTEXITCODE -ne 0) { throw 'Preflight workspace installation failed' }
            pnpm.cmd -w i18n:coverage
            if ($LASTEXITCODE -ne 0) { throw 'Preflight i18n generation failed' }
            pnpm.cmd --filter '@modrinth/app-frontend' run tsc:check
            if ($LASTEXITCODE -ne 0) { throw 'Preflight Vue typecheck failed' }
            node "$env:GITHUB_WORKSPACE/scripts/modrinth-fork/test_frontend.cjs" $preflight
            if ($LASTEXITCODE -ne 0) { throw 'Preflight content/profile regression tests failed' }
          } finally { Pop-Location }
          # Verify the actual pinned Tauri 2.5 CLI options before costly Rust compilation.
          Push-Location $preflight
          try {
            $buildHelp = (& pnpm.cmd --filter '@modrinth/app' tauri build --help | Out-String)
            if ($LASTEXITCODE -ne 0) { throw 'Failed to inspect installed Tauri build options' }
            foreach ($requiredFlag in @('--ci', '--bundles', '--config')) {
              if (!$buildHelp.Contains($requiredFlag)) { throw "Unsupported Tauri option: $requiredFlag" }
            }
          } finally { Pop-Location }
          Write-Host 'Full Vue typecheck, 18 regression tests and Tauri option preflight passed.'

      - name: Restore pinned native Rust engine if previously compiled
        id: rust-engine-cache
        uses: actions/cache/restore@v4
        with:
          path: scripts/modrinth-fork/fre-rust-runtime
          key: frelaunch-windows-x64-rust-975c07d9151847e6af13afc4b5ab37b6bbe78ef5-v1

      - name: Build MIT-only native game engine
        if: steps.rust-engine-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/modrinth-fork/ci-build-native-engine.ps1
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Native Rust engine compile failed' }
          if (Test-Path 'scripts/modrinth-fork/fre-rust-runtime/resources') {
            throw 'Proprietary Minecraft assets must never be uploaded'
          }

      - name: Cache compiled native engine before launcher compilation
        if: steps.rust-engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: scripts/modrinth-fork/fre-rust-runtime
          key: frelaunch-windows-x64-rust-975c07d9151847e6af13afc4b5ab37b6bbe78ef5-v1

      - name: Verify fresh or cached native engine digest and license
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = 'scripts/modrinth-fork/fre-rust-runtime'
          $info = Get-Content -LiteralPath "$runtime/BUILD-INFO.json" -Raw | ConvertFrom-Json
          if ($info.source_commit -ne '975c07d9151847e6af13afc4b5ab37b6bbe78ef5' -or $info.engine_license -ne 'MIT') {
            throw 'Unexpected native engine revision or license'
          }
          foreach ($file in @('fre-rust-client.exe', 'BUILD-INFO.json', 'LICENSE.txt', 'research-lock.json')) {
            if (!(Test-Path -LiteralPath (Join-Path $runtime $file) -PathType Leaf)) {
              throw "Native Rust engine missing $file"
            }
          }
          $digest = (Get-FileHash -LiteralPath "$runtime/fre-rust-client.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne $info.game_exe_sha256.ToLowerInvariant()) {
            throw 'Native Rust executable does not match verified build metadata'
          }
          if (Test-Path -LiteralPath "$runtime/resources") { throw 'Public builds must not contain proprietary Minecraft resources' }

      - name: Prepare and verify source without signing keys
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./FRE-MODRINTH-LOCAL.ps1
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Source generation failed' }
          Push-Location FRE-Modrinth-Source
          try {
            pnpm.cmd --filter '@modrinth/app...' install --frozen-lockfile
            if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
            pnpm.cmd -w i18n:coverage
            if ($LASTEXITCODE -ne 0) { throw 'Translation generation failed' }
            pnpm.cmd --filter '@modrinth/app-frontend' run tsc:check
            if ($LASTEXITCODE -ne 0) { throw 'Vue typecheck failed' }
            node ../scripts/modrinth-fork/test_frontend.cjs .
            if ($LASTEXITCODE -ne 0) { throw 'Content and profile regression tests failed' }
          } finally { Pop-Location }

      - name: Build independent preview without updater signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location FRE-Modrinth-Source
          try {
            # Preview is a standalone unsigned installer, never a signed updater.
            # The pinned Tauri 2.5 CLI has no --no-sign flag; use this override.
            $env:TAURI_SIGNING_PRIVATE_KEY = $null
            $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = $null
            $configFile = 'apps/app/tauri.preview.conf.json'
            Set-Content -LiteralPath $configFile -Value '{"bundle":{"createUpdaterArtifacts":false}}' -Encoding utf8
            if ((Get-Content -LiteralPath $configFile -Raw | ConvertFrom-Json).bundle.createUpdaterArtifacts -ne $false) {
              throw 'Preview config must disable signed updater artifacts'
            }
            pnpm.cmd --filter '@modrinth/app' tauri build --ci --bundles nsis --config tauri.preview.conf.json
            if ($LASTEXITCODE -ne 0) { throw 'Unsigned preview installer build failed' }
          } finally { Pop-Location }

      - name: Scan preview with Microsoft Defender before sharing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'FRE-Modrinth-Source/target/release/bundle/nsis'
          $installer = Get-ChildItem $dir -File -Filter '*.exe' | Select-Object -First 1
          if (!$installer) { throw 'Preview NSIS installer missing' }
          if (!(Get-Command Get-MpComputerStatus -ErrorAction SilentlyContinue)) {
            throw 'Microsoft Defender unavailable: do not share build'
          }
          $defender = Get-MpComputerStatus
          if (!$defender.AMServiceEnabled -or !$defender.AntivirusEnabled) {
            throw 'Microsoft Defender inactive: do not share build'
          }
          Update-MpSignature -ErrorAction Stop
          Start-MpScan -ScanType CustomScan -ScanPath $installer.FullName -ErrorAction Stop
          if (!(Test-Path -LiteralPath $installer.FullName)) { throw 'Installer quarantined' }
          $appExe = Get-Item -LiteralPath 'FRE-Modrinth-Source/target/release/FRE LAUNCH.exe' -ErrorAction SilentlyContinue
          if (!$appExe) { throw 'Launcher executable missing' }
          Start-MpScan -ScanType CustomScan -ScanPath $appExe.FullName -ErrorAction Stop
          $rustExe = 'scripts/modrinth-fork/fre-rust-runtime/fre-rust-client.exe'
          Start-MpScan -ScanType CustomScan -ScanPath $rustExe -ErrorAction Stop
          if (@(Get-MpThreatDetection).Count -gt 0) { throw 'Defender reported a threat: preview upload blocked' }
          "PREVIEW_INSTALLER=$($installer.FullName)" >> $env:GITHUB_ENV

      - name: Smoke-test clean preview installation and launch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:RUNNER_TEMP 'FRELaunch0510Preview'
          $installer = Start-Process -FilePath $env:PREVIEW_INSTALLER -ArgumentList @('/S',"/D=$folder") -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Preview installer failed: $($installer.ExitCode)" }
          # The bundled native Rust game is also an EXE. Launch exactly FRE LAUNCH,
          # never the largest arbitrary bundled program.
          $executables = @(Get-ChildItem -LiteralPath $folder -Recurse -File -Filter 'FRE LAUNCH.exe')
          if ($executables.Count -ne 1) { throw "Expected one installed FRE LAUNCH.exe, found $($executables.Count)" }
          $app = Start-Process -FilePath $executables[0].FullName -PassThru
          Start-Sleep -Seconds 12
          $app.Refresh()
          if ($app.HasExited) { throw "Preview launcher exited unexpectedly: $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force

      - name: Stage reviewed preview only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path preview-artifacts | Out-Null
          $target = 'preview-artifacts/FRE-LAUNCH-v0.5.10-PREVIEW-Windows-x64-Setup.exe'
          Copy-Item -LiteralPath $env:PREVIEW_INSTALLER -Destination $target
          (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content -LiteralPath 'preview-artifacts/SHA256.txt'
          $notes = @(
            "FRE LAUNCH v0.5.10 preview from main commit $env:GITHUB_SHA."
            'UNSIGNED TEST BUILD, not a signed update for installed v0.5.9.'
            'Microsoft Defender scan and clean installation startup smoke passed in Windows CI.'
            'Includes Java in-app Modrinth catalog, optional approved-key CurseForge search,'
            'Rust/Horizon file viewing, and detached Horizon Play.'
            'This preview never contains private Minecraft game resources.'
            'To publish an automatic update, restore the ORIGINAL 0.5.9 Tauri signing key.'
          )
          Set-Content -LiteralPath 'preview-artifacts/README.txt' -Value $notes -Encoding utf8

      - name: Upload Windows preview (not official release)
        uses: actions/upload-artifact@v4
        with:
          name: FRE-LAUNCH-v0.5.10-PREVIEW-Windows
          path: preview-artifacts/
          if-no-files-found: error
          retention-days: 7
